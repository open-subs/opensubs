[package]
name = "opensubs-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "opensubs desktop app (Tauri shell)"

[lib]
# The `_lib` suffix keeps the lib crate name from colliding with the `opensubs-desktop`
# binary target -- an issue on Windows only, but harmless everywhere. Matches the pattern
# `tauri`'s own scaffolding uses (see openpdfedit's/openphotoid's desktop crates).
name = "opensubs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", features = ["blocking"] }
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }
subs-media = { workspace = true }
subs-asr = { workspace = true }
subs-whisper = { workspace = true }
subs-m2m = { workspace = true }
subs-style = { workspace = true }
subs-subtitle = { workspace = true }
subs-pipeline = { workspace = true }
subs-tier = { workspace = true }
subs-translate = { workspace = true, features = ["http"] }

[dev-dependencies]
tempfile = "3"
# A mock Tauri runtime, so the burn command can be driven end to end on
# real files in a test, with no window.
tauri = { version = "2", features = ["test"] }

[[bin]]
name = "opensubs-desktop"
path = "src/main.rs"

[features]
# Whisper on a separate graphics card through Vulkan, on Windows and Linux
# (crates/subs-whisper, `device`). Off by default: only the graphics-card test
# build (.github/workflows/windows-gpu.yml) turns it on, and that build carries
# the Vulkan loader beside the exe (tauri.vulkan.conf.json), without which a
# program linked to Vulkan does not start.
vulkan = ["subs-whisper/vulkan"]
