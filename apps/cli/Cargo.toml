[package]
name = "opensubs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opensubs"
path = "src/main.rs"

[dependencies]
subs-media = { workspace = true }
subs-asr = { workspace = true }
subs-whisper = { workspace = true }
subs-subtitle = { workspace = true }
subs-style = { workspace = true }
subs-pipeline = { workspace = true }
subs-tier = { workspace = true }
subs-translate = { workspace = true, features = ["http"] }
serde_json = { workspace = true }

[features]
# Whisper on a separate graphics card through Vulkan (crates/subs-whisper,
# `device`). Needs the Vulkan SDK to build and the Vulkan loader to run.
vulkan = ["subs-whisper/vulkan"]
