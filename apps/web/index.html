<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>OpenSubs — the app</title>
    <!-- The app, on its own: for development, and as the half the site repo
         composes around. opensubs.app is one document — this app with the
         product page around it — and the page lives in the private site repo.
         It takes everything from the app-head marker to the end of this head,
         and everything between app:begin and app:end.

         Nothing above the marker is carried across, so the page's own head
         cannot be shipped twice. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- app-head -->
  </head>
  <body>
    <!-- The slots the app fills by id, so it is usable on its own. On the
         composed page the real site header carries the same ids and this bar,
         being outside the markers, is left behind. -->
    <div style="display:flex;gap:12px;justify-content:flex-end;padding:8px 16px">
      <div id="language"></div>
      <div id="account"></div>
    </div>

    <!-- app:begin -->
    <div id="app">
      <!-- APP-48: a static rendering of the tool's first screen, in the
           HTML that comes off the wire.
           
           The app is client-rendered, so the first thing a crawler fetched
           was a page whose subject -- the tool -- was not in it. Google
           executes JavaScript but defers it, and a competitor whose upload
           control is in the served HTML is read on the first pass while
           this one waits for the second.
           
           Svelte replaces all of this the moment it mounts (see
           src/main.ts, which empties the target first), so nobody sees it
           for more than a frame. It is not a mock-up: the copy, the
           heading and the control are the ones the app itself renders. -->
      <main class="screen">
        <section class="card">
          <h2 class="section-title">Video</h2>
          <label class="drop-zone">
            <p class="drop-zone-title">Drop a video here, or choose one</p>
            <p class="oa-caption">It stays on your device. No upload, no account.</p>
            <input type="file" accept="video/*" />
          </label>
        </section>

        <section class="card">
          <h2 class="section-title">Subtitles</h2>
          <p class="oa-caption">
            Whisper runs here, in your browser, and writes the subtitles from
            the video&rsquo;s own audio. Nothing is uploaded and no account is
            needed.
          </p>
        </section>

        <noscript>
          <p class="oa-caption">
            The recogniser, the styling and the burn all run in this tab, so
            OpenSubs needs JavaScript. Nothing is uploaded either way.
          </p>
        </noscript>
      </main>
    </div>
    <!-- app:end -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
