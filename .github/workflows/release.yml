name: release

# Every tag builds artefacts and attaches them to a release, release
# candidates included -- `v0.1.0-rc.1` is how a build reaches people trying it.
# A tag with a hyphen is a pre-release; one without (v1.0.3) is a full
# release and becomes the repository's Latest.
#
# Nothing in this repository submits to a store: there is no Chrome, Edge,
# Firefox or winget workflow. A bare tag produces the GitHub release and
# nothing else.
#
# workflow_dispatch builds without releasing anything, with the ggml levels
# chosen by hand. It exists to prove the instruction check: dispatch it with
# ggml_native=ON and ggml_avx512=ON and the Windows and Linux jobs must fail,
# naming ggml and the AVX-512 instructions; dispatch it with both OFF and they
# must pass.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ggml_native:
        description: "GGML_NATIVE (OFF for every release)"
        type: choice
        options: ["OFF", "ON"]
        default: "OFF"
      ggml_avx512:
        description: "GGML_AVX512 (OFF for every release)"
        type: choice
        options: ["OFF", "ON"]
        default: "OFF"

permissions:
  contents: write

jobs:
  extension:
    name: browser extension
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/extension/package-lock.json }
      - run: npm ci
        working-directory: apps/extension
      - run: npm run build:all && npm run package
        working-directory: apps/extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: apps/extension/packages/*.zip
          # A job that uploads nothing must fail here rather than warn.
          # Otherwise it goes green, the release step finds no files, and
          # the only signal is a tag with an empty release hanging off it.
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # whisper-rs-sys does not rebuild when a GGML_* variable changes, so
        # a target dir cached under other settings would keep that build. A
        # new key whenever the GGML_* levels below change never restores one.
        # A dispatched build with other levels gets a key of its own, so it
        # can never seed a release build.
        with: { key: "ggml-native-${{ inputs.ggml_native || 'OFF' }}-avx512-${{ inputs.ggml_avx512 || 'OFF' }}" }
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
        working-directory: apps/desktop
      # What the Mac and Windows installers carry so nothing is installed
      # afterwards: the Whisper Base model and a self-contained ffmpeg with
      # libass. Transcription itself is linked in (crates/subs-whisper).
      - name: Bundled model and ffmpeg
        if: matrix.os != 'ubuntu-22.04'
        shell: bash
        run: bash apps/desktop/scripts/fetch-bundled.sh
      - run: npx tauri build
        id: build
        working-directory: apps/desktop
        env:
          # whisper.cpp (crates/subs-whisper) uses std::filesystem, which
          # macOS has from 10.15; the toolchain's default target is older.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Windows: the static C runtime. ct2rs builds CTranslate2 with /MT,
          # and linking it into Rust's default /MD failed with LNK2038
          # (RuntimeLibrary mismatch). whisper.cpp's cmake build follows
          # the flag, and the installer stops needing the VC++ runtime.
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
          # Windows: the linker writes which library and object every address
          # of the exe came from (apps/desktop/src-tauri/build.rs passes
          # /MAP for the binary only), so the instruction check after the
          # build can tell ggml's code from code that picks its instruction
          # set at run time.
          OPENSUBS_LINKER_MAP: ${{ matrix.os == 'windows-latest' && format('{0}\target\opensubs-desktop.map', github.workspace) || '' }}
          # ggml defaults to GGML_NATIVE: it compiles for whatever CPU the
          # runner happens to have. On a runner with AVX-512 that gave an
          # installer which died with an illegal instruction (0xc000001d)
          # the moment transcription started, on every machine without it --
          # most laptops. whisper-rs-sys hands GGML_* through to cmake, and
          # with native off ggml targets AVX2, which any x86-64 CPU from
          # 2013 on has. CTranslate2 picks its instruction set at run time
          # and needs nothing here.
          #
          # Every level is set rather than left to ggml's defaults, so a
          # change of default upstream cannot move it. On x86 that is AVX2 +
          # FMA + F16C + BMI2 and nothing above; MSVC takes FMA and F16C as
          # implied by AVX2 and ignores those two. The ARM Mac ignores all of
          # them. Change the rust-cache key above when changing any of these.
          GGML_NATIVE: ${{ inputs.ggml_native || 'OFF' }}
          GGML_SSE42: "ON"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          GGML_FMA: "ON"
          GGML_F16C: "ON"
          GGML_BMI2: "ON"
          GGML_AVX_VNNI: "OFF"
          GGML_AVX512: ${{ inputs.ggml_avx512 || 'OFF' }}
          GGML_AVX512_VBMI: "OFF"
          GGML_AVX512_VNNI: "OFF"
          GGML_AVX512_BF16: "OFF"
          GGML_AMX_TILE: "OFF"
          GGML_AMX_INT8: "OFF"
          GGML_AMX_BF16: "OFF"
      # The flag above is easy to lose and the failure only shows on someone
      # else's computer, so check what cmake actually configured.
      - name: whisper.cpp built for any CPU, not the runner's
        shell: bash
        run: |
          cache="$(ls target/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt | head -1)"
          echo "$cache"
          grep -E '^GGML_(NATIVE|SSE42|AVX|AVX2|BMI2|AVX_VNNI|AVX512[A-Z_0-9]*|AMX_[A-Z0-9]+):BOOL=' "$cache"
          grep -q '^GGML_NATIVE:BOOL=OFF' "$cache" || { echo "ggml was built for this runner's CPU" >&2; exit 1; }
          ! grep -qE '^GGML_(AVX512[A-Z_0-9]*|AVX_VNNI|AMX_[A-Z0-9]+):BOOL=ON' "$cache" || { echo "ggml was built with an instruction set above AVX2" >&2; exit 1; }
          if [ "${{ matrix.os }}" != macos-latest ]; then
            grep -q '^GGML_AVX2:BOOL=ON' "$cache" || { echo "ggml was built without AVX2" >&2; exit 1; }
          fi
      # The same question asked of the finished binary instead of the build
      # settings: every instruction is decoded, and only CTranslate2/ruy and
      # aws-lc, which check the CPU before using them, may go above AVX2.
      # It runs even when the CMakeCache check above failed, so a bad build
      # is always reported with the library and the instructions. The
      # result goes to the job summary and, as isa-check-*.md, into the
      # release. v1.0.3-rc.13's Windows exe fails it (33 ggml functions with
      # AVX-512); rc.12, rc.14 and rc.16 pass, on Windows and Linux.
      - name: "instruction check: Windows exe"
        if: matrix.os == 'windows-latest' && !cancelled() && steps.build.outcome == 'success'
        shell: bash
        run: |
          python -m pip install --quiet iced-x86==1.21.0
          map=target/opensubs-desktop.map
          if [ ! -s "$map" ]; then
            echo "no linker map at $map; maps under target/:" >&2
            find target -maxdepth 3 -name '*.map' >&2
            exit 1
          fi
          status=0
          python scripts/check-isa.py target/release/opensubs-desktop.exe --map "$map" --report isa-check-windows.md || status=$?
          cat isa-check-windows.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # The binaries the Linux packages actually carry: unpacked from the
      # .deb and from the AppImage, not taken from target/.
      - name: "instruction check: Linux deb and AppImage"
        if: matrix.os == 'ubuntu-22.04' && !cancelled() && steps.build.outcome == 'success'
        shell: bash
        run: |
          python3 -m pip install --quiet iced-x86==1.21.0
          deb="$(ls target/release/bundle/deb/*.deb | head -1)"
          appimage="$(ls target/release/bundle/appimage/*.AppImage | head -1)"
          mkdir -p "$RUNNER_TEMP/deb" "$RUNNER_TEMP/appimage"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP/appimage" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract usr/bin/opensubs-desktop >/dev/null)
          sha256sum "$RUNNER_TEMP"/deb/usr/bin/opensubs-desktop "$RUNNER_TEMP"/appimage/squashfs-root/usr/bin/opensubs-desktop
          status=0
          python3 scripts/check-isa.py "$RUNNER_TEMP/deb/usr/bin/opensubs-desktop" --report isa-check-linux-deb.md || status=1
          python3 scripts/check-isa.py "$RUNNER_TEMP/appimage/squashfs-root/usr/bin/opensubs-desktop" --report isa-check-linux-appimage.md || status=1
          { echo "Linux, from $(basename "$deb")"; cat isa-check-linux-deb.md; echo; echo "Linux, from $(basename "$appimage")"; cat isa-check-linux-appimage.md; } > isa-check-linux.md
          rm isa-check-linux-deb.md isa-check-linux-appimage.md
          cat isa-check-linux.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          # The workspace root, not apps/desktop/src-tauri. Cargo puts a
          # workspace member's output in the *workspace's* target dir, so
          # tauri bundles land here:
          #   target/release/bundle/{dmg,appimage,deb,rpm,msi,nsis}/
          # The first cut of this file guessed the crate-local path, all
          # three platforms built cleanly, and every one of them uploaded
          # nothing at all.
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            isa-check-*.md
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: [extension, desktop]
    # Only a tag releases; a dispatched build stops at its artifacts. An RC
    # may lose a desktop platform and still release what built -- a release
    # with the extension on it is still a release. A full release (no hyphen)
    # needs every job green: it becomes Latest, and a partial one would be
    # what people download.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      (contains(github.ref_name, '-') ||
       (needs.desktop.result == 'success' && needs.extension.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: list what was built
        run: find artifacts -type f | sort
      # The instruction checks' results, as the release's notes.
      - name: release notes
        run: |
          {
            echo "## Instruction check"
            echo
            echo "Each Windows and Linux desktop binary was decoded instruction by instruction by scripts/check-isa.py, which fails the build if anything outside runtime-dispatched code (CTranslate2/ruy, aws-lc) needs more than AVX2. The reports are also attached as isa-check-*.md."
            echo
            for os in windows linux; do
              f="$(find artifacts -name "isa-check-$os.md" | head -1)"
              if [ -n "$f" ]; then cat "$f"; else echo "**$os: no report, and no $os installer in this release** (its build or its check did not pass)."; fi
              echo
            done
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
