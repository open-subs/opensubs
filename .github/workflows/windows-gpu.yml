name: windows graphics-card test build

# Whisper on a separate graphics card, through Vulkan, as a Windows installer
# to try on real computers. Nothing else builds this: no tag starts it, no
# release carries it, and the app's `vulkan` feature is off everywhere but
# here. It exists because the question it answers -- is transcription faster
# on a graphics card, and does the app still work on a computer without one
# -- cannot be answered on a build machine, which has no graphics card.
#
# What it does that the release build does not:
#   - installs the Vulkan SDK, which the Vulkan backend needs to compile;
#   - builds the app with `--features vulkan`;
#   - puts the Vulkan loader (vulkan-1.dll) beside the exe. A program linked
#     to Vulkan does not start without one, and a computer with no graphics
#     driver -- a virtual machine, a bare Windows install -- has none;
#   - runs the transcriber on the runner, which has no graphics card, so the
#     log shows the build starting and falling back to the processor;
#   - publishes the installer as a pre-release tagged gpu-test-<number>, a
#     name no other workflow listens for.
#
# Before any of this becomes part of a release: NOTICE has to name the
# Vulkan loader (Apache-2.0) the installer would carry.

on:
  workflow_dispatch:
    inputs:
      number:
        description: "Test build number: the pre-release is tagged gpu-test-<number>"
        required: true
        default: "1"
  # A workflow can only be started by hand once it is on the default branch.
  # A push to a branch of this name runs it wherever it is, numbered by the
  # run.
  push:
    branches: [gpu-test]

permissions:
  contents: write

env:
  # The version llama.cpp's own Windows Vulkan build installs.
  VULKAN_VERSION: 1.4.313.2
  # A short build folder. The Vulkan backend builds its shader compiler as a
  # project inside a project, and under the workspace's own target folder one
  # of MSBuild's tracking logs came to 261 characters, one more than Windows
  # paths may have: "FTK1011: could not create the new file tracking log".
  CARGO_TARGET_DIR: D:\t
  # The same folder as bash spells it.
  T: /d/t
  # As the release build: the static C runtime, and ggml compiled for any
  # x86-64 CPU with AVX2 rather than for this runner's (see release.yml,
  # where each of these is explained).
  RUSTFLAGS: -C target-feature=+crt-static
  GGML_NATIVE: "OFF"
  GGML_SSE42: "ON"
  GGML_AVX: "ON"
  GGML_AVX2: "ON"
  GGML_FMA: "ON"
  GGML_F16C: "ON"
  GGML_BMI2: "ON"
  GGML_AVX_VNNI: "OFF"
  GGML_AVX512: "OFF"
  GGML_AVX512_VBMI: "OFF"
  GGML_AVX512_VNNI: "OFF"
  GGML_AVX512_BF16: "OFF"
  GGML_AMX_TILE: "OFF"
  GGML_AMX_INT8: "OFF"
  GGML_AMX_BF16: "OFF"

jobs:
  build:
    name: installer with Vulkan
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # A key of its own: whisper-rs-sys built with Vulkan must never seed
        # a release build, nor the other way round.
        # "clang": whisper-rs-sys does not rebuild when the compiler changes,
        # so a cache from the MSVC build must never be restored into this one.
        with: { key: "ggml-vulkan-clang2-${{ env.VULKAN_VERSION }}" }

      # whisper.cpp compiled by clang-cl, not MSVC. Measured on the same
      # 4-core build machine, the 11 s sample with the base model took 20.8 s
      # in Whisper when MSVC compiled ggml and 2.1 s when clang-cl did (gcc on
      # Linux: 1.2 s); voice detection, loading and word alignment were each
      # a fraction of a second either way, and OpenMP threads were slower.
      # That is the whole difference between a few minutes of speech taking
      # about an hour on a laptop's processor and taking a few minutes.
      # Visual Studio's own clang-cl, because the runner's standalone LLVM is
      # older than the Visual Studio C++ library accepts; Ninja, because the
      # Visual Studio generator ignores the compiler; exceptions on and the
      # static C runtime, which that generator would otherwise have set.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: clang-cl and Ninja for whisper.cpp
        shell: pwsh
        run: |
          $clang = Get-ChildItem "$env:VCINSTALLDIR\Tools\Llvm\x64\bin\clang-cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $clang) { throw "Visual Studio has no clang-cl here: $env:VCINSTALLDIR" }
          & $clang.FullName --version
          # Only whisper.cpp: whisper-rs-sys hands every CMAKE_* variable to
          # its own cmake and to nothing else. A plain CC/CXX reaches every C
          # dependency, and CTranslate2's cpuinfo does not compile under
          # clang-cl. (CMAKE_GENERATOR is read by every cmake build; the
          # others build with MSVC under Ninja as they did under Visual Studio.)
          $cl = $clang.FullName -replace '\\','/'
          "CMAKE_C_COMPILER=$cl" | Out-File -Append $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER=$cl" | Out-File -Append $env:GITHUB_ENV
          "CMAKE_CXX_FLAGS=/EHsc" | Out-File -Append $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" | Out-File -Append $env:GITHUB_ENV
          "CMAKE_POLICY_DEFAULT_CMP0091=NEW" | Out-File -Append $env:GITHUB_ENV
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" | Out-File -Append $env:GITHUB_ENV

      - name: Vulkan SDK
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $exe --accept-licenses --default-answer --confirm-command install | Out-Host
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Lib\vulkan-1.lib")) { throw "no Vulkan SDK at $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -Append $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append $env:GITHUB_PATH

      - run: npm install
        working-directory: apps/desktop
      - name: Bundled model and ffmpeg
        shell: bash
        run: bash apps/desktop/scripts/fetch-bundled.sh

      # The loader the installer carries, from the SDK just installed or,
      # failing that, from the runner's own Windows.
      - name: Vulkan loader for the installer
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '32|x86|arm' } | Select-Object -ExpandProperty FullName)
          $found += "$env:WINDIR\System32\vulkan-1.dll"
          $dll = $found | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dll) { throw "no 64-bit vulkan-1.dll in the SDK or in System32" }
          "loader: $dll"
          Copy-Item $dll apps\desktop\src-tauri\bundled\vendor\vulkan-1.dll
          Get-Item apps\desktop\src-tauri\bundled\vendor\vulkan-1.dll | Format-List Name, Length, @{n='Version';e={$_.VersionInfo.FileVersion}}

      - name: Build the installer
        id: build
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis --features vulkan --config src-tauri/tauri.vulkan.conf.json
        env:
          OPENSUBS_LINKER_MAP: D:\t\opensubs-desktop.map

      - name: whisper.cpp built with Vulkan, for any CPU
        shell: bash
        run: |
          cache="$(ls "$T"/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt | head -1)"
          echo "$cache"
          grep -E '^GGML_(VULKAN|NATIVE|AVX2|AVX512[A-Z_0-9]*):BOOL=' "$cache"
          grep -q '^GGML_VULKAN:BOOL=ON' "$cache" || { echo "ggml was built without Vulkan" >&2; exit 1; }
          grep -E '^CMAKE_CXX_COMPILER:' "$cache"
          grep -qiE '^CMAKE_CXX_COMPILER:[A-Z]*=.*clang-cl' "$cache" || { echo "whisper.cpp was not compiled by clang-cl" >&2; exit 1; }
          grep -q '^GGML_NATIVE:BOOL=OFF' "$cache" || { echo "ggml was built for this runner's CPU" >&2; exit 1; }
          ! grep -qE '^GGML_(AVX512[A-Z_0-9]*|AVX_VNNI|AMX_[A-Z0-9]+):BOOL=ON' "$cache" || { echo "ggml was built with an instruction set above AVX2" >&2; exit 1; }

      - name: "instruction check: Windows exe"
        shell: bash
        run: |
          python -m pip install --quiet iced-x86==1.21.0
          status=0
          python scripts/check-isa.py "$T/release/opensubs-desktop.exe" --map "$T/opensubs-desktop.map" --report isa-check-windows.md || status=$?
          cat isa-check-windows.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: The loader is beside the exe in the installer
        shell: bash
        run: |
          exe="$(ls "$T"/release/bundle/nsis/*-setup.exe | head -1)"
          7z l "$exe" | tee "$RUNNER_TEMP/listing.txt" | grep -iE 'vulkan-1\.dll|opensubs-desktop\.exe'
          # A name with no folder in front of it is at the top of the install
          # folder, which is where the exe is.
          awk '{print $NF}' "$RUNNER_TEMP/listing.txt" | grep -qix 'vulkan-1\.dll' || { echo "vulkan-1.dll is not at the top of the installer, next to the exe" >&2; exit 1; }
          awk '{print $NF}' "$RUNNER_TEMP/listing.txt" | grep -qix 'opensubs-desktop\.exe' || { echo "the exe is not at the top of the installer" >&2; exit 1; }

      # The runner has no graphics card. The same code as the app, started
      # the way the installed app starts -- with only the loader beside it --
      # has to list no usable chip and transcribe on the processor.
      - name: The transcriber starts and works with no graphics card
        shell: pwsh
        run: |
          cargo build --release -p subs-whisper --features vulkan --examples
          Copy-Item apps\desktop\src-tauri\bundled\vendor\vulkan-1.dll "$env:CARGO_TARGET_DIR\release\examples\"
          "--- graphics chips on this runner"
          & "$env:CARGO_TARGET_DIR\release\examples\chips.exe"
          if ($LASTEXITCODE -ne 0) { throw "chips exited $LASTEXITCODE" }
          Invoke-WebRequest "https://raw.githubusercontent.com/ggerganov/whisper.cpp/master/samples/jfk.wav" -OutFile "$env:RUNNER_TEMP\jfk.wav"
          "--- transcription"
          $out = & "$env:CARGO_TARGET_DIR\release\examples\transcribe.exe" apps\desktop\src-tauri\bundled\models\ggml-base.bin "$env:RUNNER_TEMP\jfk.wav" en 2>"$env:RUNNER_TEMP\whisper.log"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\whisper.log" | Select-String -Pattern "vulkan|use gpu|backend|language|opensubs:" | Select-Object -First 40
          $out
          if ($code -ne 0) { throw "transcribe exited $code" }
          if (-not ($out -match "country")) { throw "the transcript does not hold the sample's words" }

      - name: Name and publish the test build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number || github.run_number }}
        run: |
          src="$(ls "$T"/release/bundle/nsis/*-setup.exe | head -1)"
          version="$(basename "$src" | sed -E 's/^OpenSubs_([0-9.]+)_x64-setup\.exe$/\1/')"
          out="OpenSubs_${version}_x64-gpu-test-${NUMBER}-setup.exe"
          cp "$src" "$out"
          sha256sum "$out" | tee SHA256SUMS.txt
          ls -l "$out"
          gh release create "gpu-test-${NUMBER}" "$out" SHA256SUMS.txt isa-check-windows.md \
            --target "$GITHUB_SHA" --prerelease \
            --title "Windows graphics-card test build ${NUMBER}" \
            --notes "A test build of OpenSubs ${version} for Windows that transcribes on a separate graphics card (Vulkan) when the computer has one, and on the processor otherwise, with whisper.cpp compiled by clang-cl (about ten times faster on the processor than the MSVC build). For testing only: it is not a release, is not signed, and replaces an installed OpenSubs."
