name: windows processor speed check

# How long whisper.cpp takes to transcribe on a processor, by compiler.
# Nothing ships from here. The Windows release build spends about 13 s in
# Whisper for an 11 s sample on a 4-core build machine, where an ARM Mac's
# processor takes 0.25 s; voice detection, loading and word alignment are
# each a fraction of a second, and OpenMP threads made it slower (20 s).
# This compares compilers on the same kind of machine:
#   windows-msvc   -- as release.yml (MSVC, the Visual Studio generator)
#   windows-clang  -- clang-cl with Ninja, everything else the same
#   linux-gcc      -- gcc on Linux, the same ggml settings
# Each prints the per-stage times of examples/stages.rs.

on:
  push:
    branches: [cpu-speed-check]
  workflow_dispatch:

permissions:
  contents: read

env:
  GGML_NATIVE: "OFF"
  GGML_SSE42: "ON"
  GGML_AVX: "ON"
  GGML_AVX2: "ON"
  GGML_FMA: "ON"
  GGML_F16C: "ON"
  GGML_BMI2: "ON"
  GGML_AVX_VNNI: "OFF"
  GGML_AVX512: "OFF"
  GGML_AVX512_VBMI: "OFF"
  GGML_AVX512_VNNI: "OFF"
  GGML_AVX512_BF16: "OFF"
  GGML_AMX_TILE: "OFF"
  GGML_AMX_INT8: "OFF"
  GGML_AMX_BF16: "OFF"

jobs:
  speed:
    name: ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: windows-msvc, os: windows-latest }
          - { variant: windows-clang, os: windows-latest }
          - { variant: linux-gcc, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.variant == 'windows-clang'
      # Visual Studio's own clang-cl: the standalone LLVM on the runner is
      # older than the Visual Studio C++ library accepts.
      - name: clang-cl and Ninja
        if: matrix.variant == 'windows-clang'
        shell: pwsh
        run: |
          $clang = Get-ChildItem "$env:VCINSTALLDIR\Tools\Llvm\x64\bin\clang-cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $clang) { throw "Visual Studio has no clang-cl here: $env:VCINSTALLDIR" }
          & $clang.FullName --version
          "CC=$($clang.FullName)" | Out-File -Append $env:GITHUB_ENV
          "CXX=$($clang.FullName)" | Out-File -Append $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" | Out-File -Append $env:GITHUB_ENV
          # The Visual Studio generator turns C++ exceptions on by itself;
          # with Ninja they have to be asked for, and ggml uses them.
          "CXXFLAGS=/EHsc" | Out-File -Append $env:GITHUB_ENV
      - name: Windows settings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'CARGO_TARGET_DIR=D:\t' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      # From PowerShell: in bash, Git's own /usr/bin/link comes before the
      # MSVC linker that msvc-dev-cmd puts on the path.
      - name: Build
        shell: pwsh
        run: cargo build --release -p subs-whisper --example stages
      - name: Model and sample
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ggml-base.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
          curl -fsSL -o "$RUNNER_TEMP/jfk.wav" "https://raw.githubusercontent.com/ggerganov/whisper.cpp/master/samples/jfk.wav"
      - name: Each stage
        shell: bash
        run: |
          nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS"
          dir="${CARGO_TARGET_DIR:-target}"
          "$dir/release/examples/stages" "$RUNNER_TEMP/ggml-base.bin" "$RUNNER_TEMP/jfk.wav" 2>&1 | grep -E "^stage|system_info|CPU" | sed "s/^/${{ matrix.variant }} /"
