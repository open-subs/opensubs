[package]
name = "subs-m2m"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline translation with M2M-100 through CTranslate2, behind subs_translate::Translator"

[dependencies]
subs-translate = { workspace = true }
# The portable `ruy` backend: no MKL, OpenBLAS or CUDA to find on the build
# machine, so it builds the same on macOS and Windows runners.
ct2rs = { version = "0.10", default-features = false, features = ["sentencepiece", "ruy"] }
# Strips the `\\?\` prefix from a Windows model path before CTranslate2,
# which appends "/model.bin" to it, gets it. See `native_dir`.
dunce = "1"
ferrous-opencc = "0.4"
jieba-rs = "0.11"

[dev-dependencies]
# For examples/translate_video.rs: the desktop export's own path from audio
# to translated cues (transcribe, segment, translate_cues), so a translation
# problem reported on a real video can be reproduced from the command line.
subs-asr = { workspace = true }
subs-whisper = { workspace = true }
subs-media = { workspace = true }
subs-subtitle = { workspace = true }
subs-translate = { workspace = true, features = ["cues"] }
