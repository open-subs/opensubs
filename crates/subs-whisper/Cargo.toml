[package]
name = "subs-whisper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speech recognition with whisper.cpp linked into the binary, behind subs_asr::Transcriber"

[dependencies]
subs-asr = { workspace = true }
whisper-rs = "0.16"
hound = "3"
dunce = "1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
